# 単体テスト（go-gin）
name: unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go-gin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-gin/go.mod
          cache-dependency-path: go-gin/go.sum

      - name: Run unit tests
        run: go test ./...
